name: Download location photos

on:
  workflow_dispatch:
  push:
    paths:
      - 'images/manifest.json'
      - 'scripts/download_photos.py'
      - '.github/workflows/photos.yml'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - name: Download curated Commons photos
        run: python scripts/download_photos.py
      - name: Commit location photos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/*.webp images/ATTRIBUTION.md
          if ! git diff --cached --quiet; then
            git commit -m 'Add offline location photos'
            git push
          fi
