function applyPhotos(){document.querySelectorAll('[data-photo]').forEach(box=>{let id=box.dataset.photo,url=PHOTO_FILES[id];if(!url)return;let current=box.querySelector('img.location-image');if(current)return;let img=document.createElement('img');img.className='location-image';img.alt='Фотография: '+id;img.loading='lazy';img.decoding='async';img.dataset.src=url;img.onerror=()=>{img.remove();box.classList.remove('has-image')};img.onload=()=>{let old=box.querySelector('img.location-image');if(old&&old!==img)old.remove();box.prepend(img);box.classList.add('has-image')};img.src=url;});}
let photoSyncPromise=null;
async function fetchPhotos(){if(!navigator.onLine||photoSyncPromise)return photoSyncPromise;photoSyncPromise=(async()=>{try{if(navigator.serviceWorker?.controller){let reg=await navigator.serviceWorker.ready;reg.active?.postMessage({type:'CACHE_PHOTOS'});} else {await ensureOfflinePhotos();}}catch(e){console.warn('Photo cache:',e)}})();try{return await photoSyncPromise}finally{photoSyncPromise=null}}
async function ensureOfflinePhotos(){if(!('caches' in window))return {saved:0,total:PHOTO_IDS.length};let cache=await caches.open('china-family-quest-photos-v2');let saved=0;for(const id of PHOTO_IDS){let url=PHOTO_FILES[id];try{let old=await cache.match(url);if(old?.ok&&old.headers.get('content-type')?.startsWith('image/')){saved++;continue}if(!navigator.onLine)continue;let r=await fetch(url,{cache:'no-store'});if(r.ok&&r.headers.get('content-type')?.startsWith('image/')){await cache.put(url,r.clone());saved++}}catch(e){console.warn('Photo unavailable:',id,e)}}return {saved,total:PHOTO_IDS.length}}
async function canDecodePhoto(url){try{let img=new Image();img.src=url;await img.decode();return img.naturalWidth>0&&img.naturalHeight>0}catch(e){return false}}
async function showPhotoStatus(){try{let cache=await caches.open('china-family-quest-photos-v2'),cached=0,valid=0;for(const id of PHOTO_IDS){let url=PHOTO_FILES[id],response=await cache.match(url);if(response?.ok){cached++;if(await canDecodePhoto(url))valid++}}let status=document.getElementById('photoOfflineStatus');if(status)status.textContent='📷 Фото офлайн: '+valid+' из '+PHOTO_IDS.length+(valid<PHOTO_IDS.length?' · Проверить загрузку':' · Готово');if(status&&valid<cached){let note=document.getElementById('photoOfflineHelp');if(note)note.textContent='В кэше '+cached+' файлов, но открыть можно '+valid+'. Проверьте настоящие .webp в GitHub /images и обновите сайт.'}}catch(e){console.warn(e)}}
async function downloadOfflinePhotos(){let status=document.getElementById('photoOfflineStatus');if(status)status.textContent='⏳ Загружаем фотографии…';await ensureOfflinePhotos();await showPhotoStatus();applyPhotos()}



// Background photo sync: never blocks navigation, and does not touch localStorage.
let autoPhotoSyncRunning=false;
async function syncPhotosOnOpen(){
 if(autoPhotoSyncRunning||!navigator.onLine)return;
 autoPhotoSyncRunning=true;
 try {
   // The controlled Service Worker will cache image responses as they load.
   await ensureOfflinePhotos();
   if(tab==='more'&&morePage==='data')await showPhotoStatus();
 } catch(e){console.warn('Auto photo sync:',e)}
 finally{autoPhotoSyncRunning=false}
}
window.addEventListener('load',()=>{setTimeout(syncPhotosOnOpen,400)});
window.addEventListener('online',syncPhotosOnOpen);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncPhotosOnOpen()});

function mercator(lat,lon,z){const scale=256*Math.pow(2,z);return {x:(lon+180)/360*scale,y:(1-Math.log(Math.tan(lat*Math.PI/180)+1/Math.cos(lat*Math.PI/180))/Math.PI)/2*scale}}
function initDayMap(){let d=DATA.days[selectedDay],ids=d.places.filter(id=>GEO_POINTS[id]);let panel=document.getElementById('dayMap');if(!panel||!ids.length)return;let coords=ids.map(id=>GEO_POINTS[id]);let lat=Math.max(-80,Math.min(80,coords.reduce((a,c)=>a+c[0],0)/coords.length)),lon=coords.reduce((a,c)=>a+c[1],0)/coords.length;let w=panel.clientWidth||340,h=panel.clientHeight||240;let z=12;for(let k=15;k>=9;k--){let pp=coords.map(c=>mercator(c[0],c[1],k)),spanX=Math.max(...pp.map(p=>p.x))-Math.min(...pp.map(p=>p.x)),spanY=Math.max(...pp.map(p=>p.y))-Math.min(...pp.map(p=>p.y));if(spanX<w-110&&spanY<h-100){z=k;break}}let center=mercator(lat,lon,z),topX=center.x-w/2,topY=center.y-h/2,tiles='';let minX=Math.floor(topX/256),maxX=Math.floor((topX+w)/256),minY=Math.floor(topY/256),maxY=Math.floor((topY+h)/256);for(let x=minX;x<=maxX;x++)for(let y=minY;y<=maxY;y++){let xx=((x%Math.pow(2,z))+Math.pow(2,z))%Math.pow(2,z);if(y<0||y>=Math.pow(2,z))continue;tiles+=`<img loading="lazy" alt="" src="https://tile.openstreetmap.org/${z}/${xx}/${y}.png" style="left:${Math.round(x*256-topX)}px;top:${Math.round(y*256-topY)}px">`}document.getElementById('mapTiles').innerHTML=tiles;document.getElementById('mapMarkers').innerHTML=ids.map((id,i)=>{let m=mercator(...GEO_POINTS[id],z);return `<span class="map-pin" style="left:${Math.min(w-20,Math.max(20,m.x-topX))}px;top:${Math.min(h-16,Math.max(43,m.y-topY))}px" title="${esc(place(id).name)}"><span>${i+1}</span></span>`}).join('')}

 return `${header('Расходы','Одна задача: записать покупку или проверить остаток бюджета.')}

function finalPage(){let v=Object.values(state.visited).filter(Boolean).length;let all=spent();return `${back()}<section class="card hero center"><div style="font-size:44px">🏆</div><h1>Наш Китай · 2026</h1><p>23 октября — 6 ноября</p><div class="grid"><div class="mini"><div class="big">15</div><div class="sub">дней</div></div><div class="mini"><div class="big">${v}</div><div class="sub">мест посетили</div></div><div class="mini"><div class="big">${currency(spent())}</div><div class="sub">все расходы</div></div><div class="mini"><div class="big">${currency(total('shopping'))}</div><div class="sub">шопинг</div></div></div></section><section class="card"><h3>Финансовые итоги</h3><p>Все расходы вместе: <strong>${currency(all)}</strong></p><p>Жильё: <strong>${currency(hotelTotal()+total('hotel'))}</strong></p><p>Покупки: <strong>${currency(total('shopping'))}</strong></p><p>Остаток общего бюджета: <strong>${currency(state.budget-spent())}</strong></p></section><section class="card"><h3>Наши открытия</h3>${DATA.places.filter(p=>state.visited[p.id]).map(p=>`<div class="listitem">✓ ${esc(p.name)}</div>`).join('')||'<p>Отмечайте посещённые места, и они появятся здесь.</p>'}</section><button class="btn primary full" data-export="1">Сохранить финальные данные JSON</button>`}

function download(blob,name){let a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)}
function exportJSON(){state.lastExport=Date.now();try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}download(new Blob([JSON.stringify({app:'China Family Quest',version:1,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'}),`china-quest-${state.profile.toLowerCase().replace(/[^a-zа-яё0-9]+/gi,'-')}-${new Date().toISOString().slice(0,10)}.json`);render()}

function showTaxi(p){document.getElementById('root').innerHTML=`<button class="btn" data-place="${p.id}">← Назад</button><section class="card center" style="margin-top:20px"><p>Покажите водителю</p><h1 style="font-size:32px;line-height:1.55;overflow-wrap:anywhere">${esc(p.cn)}</h1><p>${esc(p.zh)}</p><button class="btn primary full" data-copy="${encodeURIComponent(p.cn)}">⧉ Скопировать</button></section>`;window.scrollTo(0,0)}
function action(el){closeMenu();let ds=el.dataset;if(ds.cachePhotos){downloadOfflinePhotos();return;}if(ds.routeBack){routeBack(()=>{if(selectedPlace){selectedPlace=null;tab='places'}else{morePage='menu';tab='more'}});return;}if(ds.today){selectedDay=Math.max(0,Math.min(14,travelClock().offset));nav('days');return}if(ds.refreshWeather){refreshWeather();return}if(ds.tab){nav(ds.tab);return}if(ds.go){nav(ds.go);return}if(ds.more){rememberPosition();tab='more';morePage=ds.more;routePush();window.scrollTo(0,0);render();return}if(ds.day!==undefined){let oldStrip=document.getElementById('dayStrip'),stripX=oldStrip?oldStrip.scrollLeft:0;rememberPosition();selectedDay=Number(ds.day);tab='days';routePush();window.scrollTo(0,0);render();let strip=document.getElementById('dayStrip');if(strip){strip.scrollLeft=stripX;let active=strip.querySelector('[aria-pressed=true]');if(active){let l=active.offsetLeft,r=l+active.offsetWidth;if(l<strip.scrollLeft)strip.scrollLeft=l-12;else if(r>strip.scrollLeft+strip.clientWidth)strip.scrollLeft=r-strip.clientWidth+12}}return}if(ds.place){rememberPosition();tab='places';selectedPlace=ds.place;routePush();window.scrollTo(0,0);render();return}if(ds.placeBack){routeBack(()=>{selectedPlace=null;tab='places'});return}if(ds.copy!==undefined){let value=decodeURIComponent(ds.copy);navigator.clipboard?.writeText(value).then(()=>toast('Скопировано')).catch(()=>prompt('Скопируйте текст:',value));return}if(ds.taxi){showTaxi(place(ds.taxi));return}if(ds.checkgroup){checkGroup=ds.checkgroup;render();return}if(ds.moneyview){moneyView=ds.moneyview;render();return}if(ds.daySkip){alert('Сегодня можно пропустить часть плана и отдохнуть. Пропущенные места не считаются ошибкой.');return}if(ds.saveNote){state.notes[ds.saveNote]=document.querySelector('[data-note="'+ds.saveNote+'"]').value;save();toast('Заметка сохранена');return}if(ds.addExp){let n=Number(document.getElementById('expAmount').value),date=document.getElementById('expDate').value,cat=document.getElementById('expCat').value,desc=document.getElementById('expDesc').value;if(!(n>0)||!date)return alert('Введите сумму больше нуля и дату.');state.expenses.push({id:(typeof crypto!=='undefined'&&typeof crypto.randomUUID==='function'?crypto.randomUUID():Date.now()+'-'+Math.random()),date,category:cat,desc,amount:n,author:state.profile,createdAt:new Date().toISOString()});save();toast('Расход добавлен');return}if(ds.delExp){if(confirm('Удалить расход?')){state.expenses=state.expenses.filter(e=>e.id!==ds.delExp);save()}return}if(ds.budget){let n=Number(document.getElementById('budgetInput').value);if(n<0)return;state.budget=n;save();return}if(ds.saveHotel!==undefined){let i=Number(ds.saveHotel);state.hotels[i]={...state.hotels[i],name:document.getElementById('hotelName'+i).value,address:document.getElementById('hotelAddr'+i).value,price:Number(document.getElementById('hotelPrice'+i).value)||0};save();toast('Отель сохранён');return}if(ds.profile){state.profile=document.getElementById('profile').value.trim()||'Мой отпуск';save();return}if(ds.export){exportJSON();return}if(ds.import){document.getElementById('jsonfile').click();return}if(ds.exportCsv){exportCSV();return}}
function toast(s){let t=document.createElement('div');t.textContent=s;t.style='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#81e0e3;color:#06202b;padding:11px 18px;border-radius:20px;z-index:50;font-weight:bold';document.body.append(t);setTimeout(()=>t.remove(),1800)}
document.addEventListener('click',e=>{let el=e.target.closest('[data-cache-photos],[data-route-back],[data-today],[data-refresh-weather],[data-tab],[data-go],[data-more],[data-day],[data-place],[data-place-back],[data-copy],[data-taxi],[data-checkgroup],[data-moneyview],[data-day-skip],[data-save-note],[data-add-exp],[data-del-exp],[data-budget],[data-save-hotel],[data-profile],[data-export],[data-import],[data-export-csv]');if(el)action(el)});document.addEventListener('change',e=>{if(e.target.dataset.visited){state.visited[e.target.dataset.visited]=e.target.checked;save()}if(e.target.dataset.check){state.checks[e.target.dataset.check]=e.target.checked;save()}});function openMenu(){document.getElementById('sideMenu').classList.add('open');document.getElementById('sideMenu').setAttribute('aria-hidden','false');document.getElementById('menuOverlay').hidden=false;document.getElementById('menuToggle').setAttribute('aria-expanded','true');document.body.classList.add('menu-open');document.getElementById('menuClose').focus()}

try{history.replaceState({questRoute:routeSnapshot()},'',location.href)}catch(e){}
window.addEventListener('popstate',e=>{closeMenu();const r=e.state&&e.state.questRoute;if(r){tab=r.tab||'home';selectedPlace=r.selectedPlace||null;selectedDay=Number.isInteger(r.selectedDay)?r.selectedDay:selectedDay;morePage=r.morePage||'menu';moneyView=r.moneyView||'trip';checkGroup=r.checkGroup||'before'}else{tab='home';selectedPlace=null;morePage='menu'}render();requestAnimationFrame(()=>{window.scrollTo(0,0);let strip=document.getElementById('dayStrip');if(strip)strip.scrollLeft=Number(r?.stripX)||0})});
let edgeStart=null;document.addEventListener('touchstart',e=>{if(e.touches.length!==1||document.body.classList.contains('menu-open'))return;const t=e.touches[0];if(t.clientX<=28&&t.clientY>85)edgeStart={x:t.clientX,y:t.clientY};else edgeStart=null},{passive:true});
document.addEventListener('touchend',e=>{if(!edgeStart||!e.changedTouches.length)return;const t=e.changedTouches[0],dx=t.clientX-edgeStart.x,dy=t.clientY-edgeStart.y;edgeStart=null;if(dx>85&&Math.abs(dy)<45){routeBack(()=>{if(selectedPlace){selectedPlace=null;tab='places'}else if(morePage!=='menu'){morePage='menu';tab='more'}else{tab='home'}})}},{passive:true});
document.getElementById('menuToggle').onclick=openMenu;document.getElementById('menuClose').onclick=closeMenu;document.getElementById('menuOverlay').onclick=closeMenu;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});document.getElementById('homeTop').onclick=()=>nav('home');document.getElementById('jsonfile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let j=JSON.parse(await f.text());let s=j.state||j;if(!s||!Array.isArray(s.expenses)||!s.visited||!s.checks||!Array.isArray(s.hotels))throw Error('Неверный формат');if(!confirm('Импорт заменит все данные этого телефона. Сначала сохраните текущий JSON. Продолжить?'))return;state={...initial(),...s};save();alert('Профиль восстановлен: '+state.profile)}catch(err){alert('Не удалось открыть JSON: '+err.message)}finally{e.target.value=''}};window.addEventListener('online',()=>{ensureWeather();fetchPhotos()});if('serviceWorker' in navigator && location.protocol==='https:'){
  let switched=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(switched)return;
    switched=true;
    // Refresh the app shell only; localStorage and all trip progress stay untouched.
    window.location.reload();
  });
  navigator.serviceWorker.register('./sw.js?v=13.0',{updateViaCache:'none'})
    .then(reg=>{reg.update().catch(console.warn);
      document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update().catch(()=>{})});
    }).catch(console.warn);
}
async function checkAppUpdate(){
 if(!('serviceWorker' in navigator)||location.protocol!=='https:'){alert('Для обновления откройте приложение с GitHub Pages.');return}
 const b=document.getElementById('checkUpdateBtn');if(b){b.disabled=true;b.textContent='⏳ Проверка…'}
 try{
  const r=await navigator.serviceWorker.getRegistration();if(!r)throw Error('Офлайн-сервис не найден');
  await r.update();
  if(r.waiting)r.waiting.postMessage({type:'SKIP_WAITING'});
  if(b)b.textContent='✅ Проверено';
  setTimeout(()=>{if(b){b.disabled=false;b.textContent='🔄 Проверить обновление'}},1800);
 }catch(e){if(b){b.disabled=false;b.textContent='🔄 Проверить обновление'}alert('Не удалось проверить обновление. Проверьте интернет. '+e.message)}
}

// Minimal Chinese art: exactly the same 1080×1920 canvas is previewed and exported.
let v13PhotoImg=null,v13PhotoObjectUrl=null,v13PhotoFocus=50,v13PhotoZoom=106;
let v13DrawScheduled=false;
const V13_W=1080,V13_H=1920;
function v13DrawCover(ctx,img,x,y,w,h,zoom=1,focus=0.5){
  const iw=img.naturalWidth||img.width,ih=img.naturalHeight||img.height;
  if(!iw||!ih)return;
  const scale=Math.max(w/iw,h/ih)*zoom,sw=w/scale,sh=h/scale;
  const sx=(iw-sw)/2,sy=Math.max(0,Math.min(ih-sh,(ih-sh)*focus));
  ctx.drawImage(img,Math.max(0,sx),sy,Math.min(iw,sw),Math.min(ih,sh),x,y,w,h);
}
function v13Paper(ctx){
  let g=ctx.createLinearGradient(0,0,0,V13_H);g.addColorStop(0,'#fbf8f1');g.addColorStop(.6,'#f9f4ea');g.addColorStop(1,'#f6f0e6');ctx.fillStyle=g;ctx.fillRect(0,0,V13_W,V13_H);
  // deterministic rice-paper flecks; subtle texture without images or network.
  for(let i=0;i<1100;i++){let x=(i*97.113+67)%V13_W,y=(i*233.37+109)%V13_H;ctx.fillStyle=i%3===0?'rgba(129,91,59,.030)':'rgba(130,109,84,.019)';ctx.fillRect(x,y,2,2)}
}
function v13InkMountains(ctx,bottom,scale=1,opacity=.13){
  ctx.save();ctx.globalAlpha=opacity;
  for(let layer=0;layer<3;layer++){
    ctx.beginPath();ctx.moveTo(0,bottom+layer*33);
    const peaks=[[0,65],[85,14],[165,88],[270,-7],[370,68],[460,12],[565,105],[680,-20],[770,80],[885,3],[970,75],[1080,15]];
    peaks.forEach(([x,y])=>ctx.lineTo(x,bottom+y*scale+layer*31));
    ctx.lineTo(V13_W,bottom+190);ctx.lineTo(0,bottom+190);ctx.closePath();
    ctx.fillStyle=['#b8b2aa','#9e9991','#c5c0b6'][layer];ctx.fill();
  }
  ctx.restore();
}
function v13PhotoBlend(ctx,img){
  const x=0,y=345,w=1080,h=1130;
  // a blurred larger extension of the SAME photo, with warm paper tint.
  ctx.save();ctx.globalAlpha=.68;ctx.filter='blur(35px) saturate(.75)';v13DrawCover(ctx,img,-90,y-60,1260,h+160,1.12,v13PhotoFocus/100);ctx.restore();
  // crisp photo softened gradually to transparent on all four sides.
  const off=document.createElement('canvas');off.width=w;off.height=h;
  const c=off.getContext('2d');v13DrawCover(c,img,0,0,w,h,v13PhotoZoom/100,v13PhotoFocus/100);
  c.globalCompositeOperation='destination-in';
  let gy=c.createLinearGradient(0,0,0,h);
  gy.addColorStop(0,'rgba(0,0,0,0)');gy.addColorStop(.07,'rgba(0,0,0,.97)');gy.addColorStop(.72,'rgba(0,0,0,1)');gy.addColorStop(.91,'rgba(0,0,0,.76)');gy.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=gy;c.fillRect(0,0,w,h);
  let gx=c.createLinearGradient(0,0,w,0);
  gx.addColorStop(0,'rgba(0,0,0,0)');gx.addColorStop(.12,'rgba(0,0,0,.99)');gx.addColorStop(.88,'rgba(0,0,0,.99)');gx.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=gx;c.fillRect(0,0,w,h);
  ctx.drawImage(off,x,y);
  // More translucent haze at the bottom into the paper and lower statistic zone.
  let haze=ctx.createLinearGradient(0,1110,0,1510);haze.addColorStop(0,'rgba(249,244,234,0)');haze.addColorStop(.66,'rgba(249,244,234,.38)');haze.addColorStop(1,'rgba(249,244,234,1)');ctx.fillStyle=haze;ctx.fillRect(0,1110,1080,400);
}
function v13FlowerBranch(ctx,x,y,flipped=false){
  ctx.save();ctx.translate(x,y);if(flipped)ctx.scale(-1,1);
  ctx.strokeStyle='#6c5548';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-20,-15);ctx.quadraticCurveTo(60,60,205,118);ctx.moveTo(93,60);ctx.quadraticCurveTo(112,7,142,6);ctx.moveTo(143,85);ctx.quadraticCurveTo(190,39,238,51);ctx.stroke();
  [[35,34],[103,60],[136,17],[184,107],[215,57]].forEach(([cx,cy],i)=>{
    ctx.save();ctx.translate(cx,cy);ctx.rotate(i*1.22);for(let k=0;k<5;k++){ctx.beginPath();const a=k*Math.PI*2/5;ctx.ellipse(Math.cos(a)*9,Math.sin(a)*9,12,6,a,0,2*Math.PI);ctx.fillStyle=i%2?'#c6473f':'#dc6d63';ctx.globalAlpha=.68;ctx.fill()}
    ctx.globalAlpha=1;ctx.beginPath();ctx.arc(0,0,4,0,2*Math.PI);ctx.fillStyle='#ad8b4e';ctx.fill();ctx.restore();
  });ctx.restore();
}
function v13CenteredText(ctx,text,x,y,size,color,weight='normal',font='Georgia, "Times New Roman", serif'){
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=color;ctx.font=`${weight} ${size}px ${font}`;ctx.fillText(text,x,y);
}
function v13Text(ctx,text,x,y,size,color,weight='normal',font='Georgia, "Times New Roman", serif'){
  ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillStyle=color;ctx.font=`${weight} ${size}px ${font}`;ctx.fillText(text,x,y);
}
function v13RedSeal(ctx,x,y,r,value,label,type='round'){
  ctx.save();ctx.translate(x,y);ctx.strokeStyle='#b42e26';ctx.lineWidth=7;
  if(type==='square'){
    ctx.strokeRect(-r,-r,r*2,r*2);ctx.globalAlpha=.15;ctx.fillStyle='#bf3127';ctx.fillRect(-r+8,-r+8,r*2-16,r*2-16);ctx.globalAlpha=1;
  }else{ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(0,0,r-12,0,Math.PI*2);ctx.lineWidth=1.7;ctx.stroke()}
  v13CenteredText(ctx,value,0,-13,67,'#a82d27','normal');
  v13CenteredText(ctx,label,0,61,25,'#a82d27','600','Georgia, serif');ctx.restore();
}
function v13DrawStory(){
  const canvas=document.getElementById('v13StoryCanvas');if(!canvas)return;
  const c=canvas.getContext('2d');if(!c)return;
  v13Paper(c);
  const t=v11StoryStats(),d=Math.max(1,t.done),daysTotal=DATA.days.length;
  const doneAll=t.visited,placeTotal=t.all.length,must=qPctDone(t.pr.must);
  // clouds, misty mountain silhouettes and plum blossoms frame a wide heroic photograph.
  v13InkMountains(c,280,.7,.14);
  if(v13PhotoImg)v13PhotoBlend(c,v13PhotoImg);
  else{
    let gradient=c.createLinearGradient(0,340,1080,1380);gradient.addColorStop(0,'#e4e8df');gradient.addColorStop(.55,'#b4c7c4');gradient.addColorStop(1,'#eff0e7');c.fillStyle=gradient;c.fillRect(0,365,1080,1020);
    v13InkMountains(c,1030,1,.35);
    v13CenteredText(c,'添 加 照 片',540,810,53,'#566d69');
    v13CenteredText(c,'Добавьте ваше фото дня',540,880,30,'#4a6766','600','Arial, sans-serif');
    let blank=c.createLinearGradient(0,1140,0,1420);blank.addColorStop(0,'#f9f4ea00');blank.addColorStop(1,'#f9f4eaff');c.fillStyle=blank;c.fillRect(0,1140,1080,280);
  }
  // heading remains readable, even with a vivid gallery photo.
  const headShade=c.createLinearGradient(0,0,0,455);headShade.addColorStop(0,'rgba(251,248,241,1)');headShade.addColorStop(.64,'rgba(251,248,241,.98)');headShade.addColorStop(1,'rgba(251,248,241,0)');c.fillStyle=headShade;c.fillRect(0,0,1080,455);
  v13FlowerBranch(c,-146,-39,false);
  v13Text(c,'C H I N A   F A M I L Y   Q U E S T',77,112,22,'#78675a','600','Arial, sans-serif');
  v13Text(c,`Наш ${d}-й день`,76,222,84,'#25231f');
  v13Text(c,'в Китае',78,317,97,'#ae2e29');
  // cinnabar seal at upper-right
  c.fillStyle='#b92f27';c.fillRect(960,82,56,119);v13CenteredText(c,'中',988,121,34,'#fff7ed');v13CenteredText(c,'国',988,166,33,'#fff7ed');
  // overlapping progress medallion in the upper right, just like selected concept 4.
  let cx=875,cy=386,r=118;
  c.fillStyle='rgba(250,247,241,.93)';c.beginPath();c.arc(cx,cy,r+11,0,Math.PI*2);c.fill();
  c.lineWidth=15;c.strokeStyle='rgba(182,156,136,.22)';c.beginPath();c.arc(cx,cy,r,-Math.PI/2,Math.PI*1.5);c.stroke();
  c.strokeStyle='#b62d27';c.lineCap='round';c.beginPath();c.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.min(d/daysTotal,1));c.stroke();
  v13CenteredText(c,String(d),cx-25,cy-22,76,'#a82925');v13CenteredText(c,'/ '+daysTotal,cx+52,cy+1,36,'#302b27');
  v13CenteredText(c,'ДНЕЙ',cx,cy+52,18,'#655b54','600','Arial, sans-serif');
  // photo-to-paper transition happens above; bottom decoration never obscures faces.
  v13InkMountains(c,1450,.62,.11);
  v13RedSeal(c,315,1595,101,String(doneAll),'ОТКРЫТИЯ');
  v13RedSeal(c,771,1595,101,must+'%','MUST-SEE');
  c.strokeStyle='#b59d8e';c.lineWidth=1.8;c.beginPath();c.moveTo(174,1782);c.lineTo(422,1782);c.moveTo(664,1782);c.lineTo(906,1782);c.stroke();
  v13CenteredText(c,`${doneAll} / ${placeTotal} мест посещено`,540,1784,31,'#413a34','normal','Georgia, serif');
  v13CenteredText(c,'Б О Л Ь Ш Е   И С Т О Р И Й   В П Е Р Е Д И',540,1854,19,'#958071','600','Arial, sans-serif');
  v13FlowerBranch(c,1082,1784,true);
  c.fillStyle='#aa332c';c.fillRect(515,1885,50,5);
}
